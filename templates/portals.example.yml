# Portal Scanner Configuration
# Used by /career-ops scan to discover new offers automatically.
#
# Strategy (3 levels):
#   1. Playwright → careers_url of each company (real-time, reliable)
#   2. Greenhouse API → structured JSON (fast, Greenhouse-only)
#   3. WebSearch with site: filters (broad discovery, may be stale)
#
# IMPORTANT: Each company in tracked_companies MUST have careers_url.
#
# HOW TO CUSTOMIZE:
#   1. Copy this file to portals.yml in the project root
#   2. Edit title_filter.positive with YOUR target role keywords
#   3. Add/remove companies in tracked_companies
#   4. Adjust search_queries for your preferred job boards
#   5. Set enabled: false on companies you don't care about

# -- Title filter --
# The scanner uses these keywords to decide if a title is relevant.
# At least 1 positive must match AND 0 negatives must match (case-insensitive).

title_filter:
  positive:
    # Core AI / LLM (your strongest match)
    - "AI"
    - "LLM"
    - "GenAI"
    - "RAG"
    - "Agent"
    - "Agentic"
    - "ML"
    - "NLP"
    - "AI Engineer"
    - "Applied AI"
    - "AI Developer"
    - "AI Software Engineer"

    # Full-stack AI (YOUR REAL SWEET SPOT)
    - "Full Stack"
    - "Software Engineer"
    - "Backend Engineer"
    - "Frontend Engineer"
    - "Solutions Engineer"
    - "Integration Engineer"
    - "Platform Engineer"

    # Product + AI hybrid roles
    - "Developer Experience"
    - "DevRel"
    - "Technical Engineer"
    - "Forward Deployed"
    - "Customer Engineer"

  negative:
    - "Intern"
    - "Junior"
    - ".NET"
    - "Java"
    - "Android"
    - "iOS"
    - "PHP"
    - "Ruby"
    - "Embedded"
    - "Firmware"
    - "Blockchain"
    - "Crypto"
    - "Salesforce Admin"
    - "SAP"
# -- Search queries --
# Each query triggers a WebSearch. Use site: to filter by portal.
# The scanner extracts title, URL, and company from results.

search_queries:
  - name: AI Engineer Remote
    query: 'AI Engineer OR Applied AI Engineer OR LLM Engineer remote'
    enabled: true

  - name: Full Stack AI
    query: 'Full Stack Engineer AI OR React FastAPI AI remote'
    enabled: true

  - name: RAG / LLM Apps
    query: 'RAG OR LangChain OR LLM application engineer remote'
    enabled: true

  - name: Solutions / Customer Engineer
    query: 'Solutions Engineer OR Customer Engineer OR Forward Deployed remote AI'
    enabled: true

  - name: React + AI startups
    query: 'React AI startup frontend engineer remote'
    enabled: true
# -- Tracked companies --
# Companies whose career pages are checked directly.
# scan_method: playwright (default), websearch, greenhouse_api
# For Greenhouse companies, add api: field for faster structured JSON access.

tracked_companies:

  # --- AI Labs ---
  - name: OpenAI
    careers_url: https://openai.com/careers
    scan_method: websearch
    scan_query: 'OpenAI AI Engineer Solutions Forward Deployed'
    enabled: true

  - name: Anthropic
    careers_url: https://job-boards.greenhouse.io/anthropic
    api: https://boards-api.greenhouse.io/v1/boards/anthropic/jobs
    enabled: true

  - name: Cohere
    careers_url: https://jobs.ashbyhq.com/cohere
    enabled: true

  # --- Best dev tools for YOUR profile ---
  - name: Supabase
    careers_url: https://jobs.ashbyhq.com/supabase
    enabled: true

  - name: Vercel
    careers_url: https://job-boards.greenhouse.io/vercel
    enabled: true

  - name: Pinecone
    careers_url: https://jobs.ashbyhq.com/pinecone
    enabled: true

  - name: LangChain
    careers_url: https://jobs.ashbyhq.com/langchain
    enabled: true

  - name: Retool
    careers_url: https://retool.com/careers
    scan_method: websearch
    scan_query: 'Retool AI Solutions Engineer Forward Deployed'
    enabled: true

  - name: ElevenLabs
    careers_url: https://jobs.ashbyhq.com/elevenlabs
    enabled: true

  # --- Your strongest category (IMPORTANT) ---
  - name: Hightouch
    careers_url: https://job-boards.greenhouse.io/hightouch
    enabled: true

  - name: WorkOS
    careers_url: https://jobs.ashbyhq.com/workos
    enabled: true

  - name: Clerk
    careers_url: https://jobs.ashbyhq.com/clerk
    enabled: true